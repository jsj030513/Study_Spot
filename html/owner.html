<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공부명당 — 사장님 페이지</title>
    <link href="https://fonts.googleapis.com/css2?family=Gmarket+Sans:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/owner.css?v=20260522-backend-sync">
</head>
<body>
    <div class="grid-bg"></div>

    <nav class="owner-nav">
        <div class="nav-logo" onclick="location.href='/main'">
            <div class="logo-badge">📍</div>
            <span class="logo-text"><span>공부</span>명당</span>
        </div>
        <div class="nav-actions">
            <a href="/main">탐색하기</a>
            <a href="/mypage">마이페이지</a>
            <button type="button" onclick="handleLogout()">로그아웃</button>
        </div>
    </nav>

    <main class="owner-shell">
        <aside class="cafe-sidebar">
            <div class="sidebar-title">
                <p>사장님 페이지</p>
                <h1>내 장소 관리</h1>
            </div>
            <div class="cafe-list" id="cafeList"></div>
        </aside>

        <section class="owner-workspace">
            <div class="empty-state" id="emptyState">
                <strong>관리할 카페를 불러오는 중입니다.</strong>
                <span>로그인 정보와 사장님 권한을 확인하고 있어요.</span>
            </div>

            <div class="owner-dashboard" id="ownerDashboard" hidden>
                <header class="workspace-header">
                    <div>
                        <p id="selectedCafeAddress">주소 정보 없음</p>
                        <h2 id="selectedCafeName">카페명</h2>
                    </div>
                    <button class="ghost-btn" type="button" onclick="refreshSelectedCafe()">새로고침</button>
                </header>

                <section class="basic-panel">
                    <div class="panel-heading">
                        <h3>카페 기본정보</h3>
                        <span>이름, 주소, 시설 정보</span>
                    </div>
                    <form class="basic-form" id="basicForm">
                        <div class="form-grid">
                            <label>
                                카페명
                                <input type="text" id="cafeNameInput" maxlength="50" required>
                            </label>
                            <label>
                                전화번호
                                <input type="tel" id="telNoInput" maxlength="15" placeholder="041-000-0000">
                            </label>
                        </div>
                        <label>
                            주소
                            <input type="text" id="addressInput" maxlength="100">
                        </label>
                        <div class="form-grid">
                            <label>
                                와이파이
                                <input type="text" id="wifiStatusInput" maxlength="10" placeholder="좋음">
                            </label>
                            <label>
                                콘센트
                                <input type="text" id="outletStatusInput" maxlength="10" placeholder="많음">
                            </label>
                            <label>
                                소음
                                <input type="text" id="noiseLevelInput" maxlength="10" placeholder="보통">
                            </label>
                            <label>
                                좌석 유형
                                <input type="text" id="seatTypeInput" maxlength="20" placeholder="테이블/바 좌석">
                            </label>
                        </div>
                        <label>
                            짧은 설명
                            <input type="text" id="descriptionInput" maxlength="255">
                        </label>
                        <button type="submit">기본정보 저장</button>
                    </form>
                </section>

                <section class="open-panel">
                    <div class="panel-heading">
                        <h3>영업 상태</h3>
                        <span id="openStatusUpdatedAt">미등록</span>
                    </div>
                    <form class="open-form" id="openStatusForm">
                        <label>
                            현재 상태
                            <select id="openStatus">
                                <option value="true">영업중</option>
                                <option value="false">마감</option>
                            </select>
                        </label>
                        <label>
                            안내 문구
                            <input type="text" id="openStatusMessage" maxlength="100" placeholder="예: 오늘은 22시까지 운영합니다.">
                        </label>
                        <button type="submit">영업상태 저장</button>
                    </form>
                </section>

                <section class="status-panel">
                    <div class="panel-heading">
                        <h3>실시간 혼잡도</h3>
                        <span id="statusUpdatedAt">미등록</span>
                    </div>
                    <form class="status-form" id="occupancyForm">
                        <label>
                            현재 인원
                            <input type="number" id="currentCount" min="0" value="0" required>
                        </label>
                        <label>
                            전체 좌석
                            <input type="number" id="capacity" min="1" value="1" required>
                        </label>
                        <label>
                            혼잡도
                            <select id="congestionLevel">
                                <option value="">자동 계산</option>
                                <option value="LOW">여유</option>
                                <option value="MEDIUM">보통</option>
                                <option value="HIGH">혼잡</option>
                            </select>
                        </label>
                        <button type="submit">저장</button>
                    </form>
                    <div class="occupancy-meter">
                        <div class="meter-top">
                            <strong id="occupancySummary">0 / 0명</strong>
                            <span id="congestionBadge">미등록</span>
                        </div>
                        <div class="meter-track"><div id="occupancyFill"></div></div>
                    </div>
                </section>

                <section class="profile-panel">
                    <div class="panel-heading">
                        <h3>카페 프로필 설정</h3>
                        <span>소개, 공지, 운영시간</span>
                    </div>
                    <form class="profile-form" id="profileForm">
                        <label>
                            소개
                            <textarea id="introText" rows="3" maxlength="1000" placeholder="카페 분위기와 특징을 적어주세요."></textarea>
                        </label>
                        <label>
                            공지
                            <textarea id="noticeText" rows="3" maxlength="1000" placeholder="오늘의 안내나 이용 공지를 적어주세요."></textarea>
                        </label>
                        <div class="form-grid">
                            <label>
                                운영시간
                                <input type="text" id="openingHours" maxlength="255" placeholder="예: 09:00 - 22:00">
                            </label>
                            <label>
                                SNS 주소
                                <input type="url" id="snsUrl" maxlength="255" placeholder="https://">
                            </label>
                        </div>
                        <label>
                            메뉴
                            <textarea id="menuText" rows="4" maxlength="1000" placeholder="대표 메뉴나 가격 정보를 적어주세요."></textarea>
                        </label>
                        <button type="submit">프로필 저장</button>
                    </form>
                </section>

                <section class="photo-panel">
                    <div class="panel-heading">
                        <h3>카페 사진 등록</h3>
                        <span>최대 6장</span>
                    </div>
                    <form class="photo-form" id="photoForm">
                        <input type="url" id="photoUrl" maxlength="500" placeholder="사진 URL을 입력하세요" required>
                        <input type="number" id="displayOrder" min="1" max="6" value="1" required>
                        <button type="submit">사진 추가</button>
                    </form>
                    <div class="photo-grid" id="photoGrid"></div>
                </section>
            </div>
        </section>
    </main>

    <script src="../js/owner.js?v=20260522-backend-sync"></script>
</body>
</html>
